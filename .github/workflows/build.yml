name: Build Jib Bank APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Create Flutter project
        run: flutter create --org com.jibbank --project-name jib_bank jib_app
      
      - name: Copy our main.dart
        run: cp main.dart jib_app/lib/main.dart
      
      - name: Build APK
        working-directory: jib_app
        run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: jib-bank-apk
          path: jib_app/build/app/outputs/flutter-apk/app-release.apk
